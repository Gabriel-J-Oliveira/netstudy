{% load static journey %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetStudy{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/netstudy.css' %}?v=journey-1">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="{% url 'learning:home' %}">NetStudy</a>
      {% journey_navigation %}
    </aside>
    <main class="main-content">
      <div class="content-column">{% block content %}{% endblock %}</div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
  <script src="{% static 'js/journey-navigation.js' %}"></script>
</body>
</html>
