{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NetStudy{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/netstudy.css' %}?v=layout-2">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <span class="brand">NetStudy</span>
      <nav class="topic-navigation" aria-label="Navegação principal">
        <a href="{% url 'learning:home' %}" {% if current_topic != 'LAB' %}aria-current="page"{% endif %}>Conteúdos</a>
        <a href="{% url 'learning:integrated_lab' %}" {% if current_topic == 'LAB' %}aria-current="page"{% endif %}>Laboratório</a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="content-column">{% block content %}{% endblock %}</div>
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
