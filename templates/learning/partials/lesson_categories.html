<nav class="lesson-categories{% if catalog %} lesson-categories-catalog{% endif %}" aria-label="Categorias de Aprender">
  {% for group in groups %}
  <details{% if group.open or catalog and forloop.first %} open{% endif %}>
    <summary>{{ group.title }}</summary>
    <ul>
      {% for link in group.links %}
      <li><a href="{{ link.url }}"{% if link.active %} aria-current="page"{% endif %}>{{ link.label }}</a></li>
      {% endfor %}
    </ul>
  </details>
  {% endfor %}
</nav>
