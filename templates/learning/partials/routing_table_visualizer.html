<section class="route-visualizer" data-route-visualizer aria-label="Routing Table Visualizer">
  <header><div><span>ROUTING TABLE VISUALIZER</span><strong>Destination IP → melhor rota</strong></div><button type="button" data-route-reset>↻ Resetar cenário</button></header>
  <div class="route-input"><label>Destination IP <input type="text" value="{{ visualizer_destination|default:'192.168.20.50' }}" data-route-destination></label><button type="button" data-route-run>Testar rotas</button></div>
  <div class="route-table" role="table" aria-label="Tabela de rotas didática">
    <div class="route-row route-head" role="row"><span>DESTINATION</span><span>NEXT HOP</span><span>INTERFACE</span><span>RESULTADO</span></div>
    {% for route in visualizer_routes %}<button type="button" class="route-row" role="row" data-prefix="{{ route.prefix }}" data-next-hop="{{ route.next_hop }}" data-interface="{{ route.interface }}" aria-label="Route {{ route.aria_prefix|default:route.prefix }} via {{ route.next_hop }} interface {{ route.interface }}">
      <code>{{ route.prefix }}</code><span>{{ route.next_hop }}</span><span>{{ route.interface }}</span><strong data-route-label>AGUARDANDO</strong>
    </button>{% endfor %}
  </div>
  <p class="route-result" data-route-result aria-live="polite">Insira um destino e teste as linhas.</p>
</section>
