<section class="transport-stage" id="transport-lab" data-transport-stage aria-label="Transport Behavior Lab" tabindex="-1">
  <header><span>TRANSPORT BEHAVIOR LAB</span><strong data-stage-heading>Escolha uma observação</strong></header>
  <div class="transport-modes" role="group" aria-label="Protocolo ativo"><button type="button" data-stage-mode="udp" aria-pressed="false">UDP</button><button type="button" data-stage-mode="tcp" aria-pressed="false">TCP</button></div>
  <div class="transport-path" aria-label="Aplicação A, Transporte, Rede IP, Transporte, Aplicação B">
    <span>Aplicação A</span><button type="button" data-stage-layer aria-label="Selecionar Camada de Transporte">Transporte</button><span>Rede IP</span><span>Transporte</span><span>Aplicação B</span>
  </div>
  <p class="transport-prompt" data-stage-prompt>Selecione a Camada de Transporte no caminho ou escolha uma observação em uma das áreas.</p>
  <div class="transport-observation"><div><small>ORIGEM / REDE</small><div class="transport-units" data-stage-source></div></div><div><small>APLICAÇÃO B</small><div class="transport-units" data-stage-destination></div></div></div>
  <ol class="transport-timeline" data-stage-timeline aria-live="polite"><li>O percurso aparecerá aqui, uma etapa por clique.</li></ol>
  <p class="transport-result" data-stage-result role="status" aria-live="polite"></p>
  <div class="transport-controls"><button type="button" data-stage-next hidden>Próxima etapa</button><button type="button" data-stage-reset>Resetar cenário</button></div>
</section>
